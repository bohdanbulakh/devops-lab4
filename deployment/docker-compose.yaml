version: "3.9"
name: kpi-demo

services:
  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6380:6379"
    networks:
      - backend

  communication-control:
    image: bohdanbulakh/communication-control
    container_name: com-control
    restart: always
    environment:
      Redis__ConnectionString: "redis:6379"
    ports:
      - "8082:8080"
    depends_on:
      - redis
    networks:
      - backend

  map-client:
    image: bohdanbulakh/communication-control-web
    container_name: map-client
    restart: always
    environment:
      VITE_API_BASE_URL: "http://localhost:8082/api/v1/client"
    ports:
      - "8081:80"
    volumes:
      - ./config.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      - communication-control
    networks:
      - backend

networks:
  backend: